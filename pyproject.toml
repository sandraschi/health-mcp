[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "health-mcp"
version = "0.1.0"
description = "Health data fusion MCP server — VSM events, Apple Health, trends, pet health"
authors = [{name = "Sandra Schipal"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Home Automation",
]
keywords = ["mcp", "health", "fastmcp", "vsm", "quantified-self"]

dependencies = [
    "fastmcp>=3.4.4,<4",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.28.1",
    "structlog>=23.0.0",
    "prefab-ui>=0.14.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
apple = [
    "pyzipper>=0.3.6",
    "lxml>=5.0.0",
]
trends = [
    "numpy>=1.26.0",
]
webapp = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.35.0",
]
dev = [
    "ruff>=0.16.0,<0.17",
    "pytest>=8.0.0",
]

[project.urls]
Homepage = "https://github.com/sandraschi/health-mcp"

[project.scripts]
health-mcp = "health_mcp.server:main"
health-mcp-webapp = "health_mcp.webapp_runner:main"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "S", "T20"]
ignore = ["S104", "S310", "S311", "S314", "S608", "S108", "S603", "S301", "S103", "S112", "S105", "S607", "S701", "S102", "S307", "S324", "ASYNC230", "B008", "B904", "B025", "B019", "B023", "C901", "UP035", "RUF006", "N806", "E501", "F841", "PLW1510", "BLE001", "RUF022", "E402", "F811", "B006", "B007", "RUF059", "RUF001", "RUF002", "S110", "RUF012", "DTZ005", "DTZ006", "DTZ001", "E741", "SIM115", "SIM102", "RUF100", "F401", "D103", "D101", "F821", "TRY002", "E501", "S106", "S110", "S112", "E501", "S106", "S110", "S112", "RUF012", "S603", "S607", "S324", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
